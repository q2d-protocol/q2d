[package]
name = "q2d"
version = "0.0.1"
edition = "2021"
description = "Query-to-Data: a transport-neutral protocol for policy-bound, least-disclosure answers over protected data. Placeholder for the reference implementation."
license = "Apache-2.0"
repository = "https://github.com/q2d-protocol/q2d"
homepage = "https://q2d.dev"
documentation = "https://q2d.dev"
readme = "README.md"
keywords = ["protocol", "privacy", "agents", "mcp", "authorization"]
categories = ["network-programming"]

[dependencies]
# The one dependency, and CONVENTIONS-rust.md §2 records why: hand-rolled curve
# arithmetic is the single loudest "do not trust this" signal a security
# protocol can send, and the acceptance rule this pins (`verify_strict`) is
# what makes the two implementations agree about which signatures are valid.
# `default-features = false` drops key *generation*, which needs an RNG and
# which Q2D does not do: every key here is a fixed test seed.
ed25519-dalek = { version = "3.0", default-features = false }
