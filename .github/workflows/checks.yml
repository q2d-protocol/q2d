name: checks

# Everything here must be green. Nothing in this workflow is expected to fail.
#
# That distinction matters more than usual on this repository, because P-001 §7
# states a gate that is deliberately red: "the harness runs, and reports fail
# for every vector, because no implementation exists." A check that is
# permanently red trains people to ignore red, and costs the signal exactly when
# it starts meaning something.
#
# The rule, stated here because this is where someone will reach for the wrong
# shape: do not add `harness run` (P-001 issue 4) or `harness coverage` (issue
# 6) as jobs that fail. Assert the expected state instead -- whatever it is at
# the time -- so the check is green while true and turns red when someone
# changes the thing without changing the expectation. The expectation is
# supposed to move: coverage read thirteen uncovered claims while the corpus
# was empty and reads ten since the registry fold, and each of those was the
# honest answer on its day.
#
# Every mode P-001 §4.7 lists now exists, and each carries its expected state in
# the suite this workflow already runs rather than as a job that fails:
#
#   run       no vector in the real corpus passes against the reference stub
#   coverage  exactly three claims are cited by a vector; ten are not
#   cross     the stub against itself compares nothing -- there is one runner,
#             and it answers nothing
#
# All three are true while no implementation exists, all three are green, and
# each turns red the day that stops being true without the expectation moving
# with it. That is the whole point: the gate is deliberately red, and a check
# asserting the red state is green and honest, where a check that simply fails
# is red and ignored.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    name: registry and conformance corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Both are standard library only, deliberately: the harness must run
      # wherever python3 does, without an install step.
      - name: Registry manifest is internally consistent and every vector holds
        run: python3 registry/validate.py

      - name: Corpus lints against the vector schema
        run: python3 conformance/harness lint

      - name: Harness tests
        run: python3 -m unittest discover -s conformance/tests

      # CLAUDE.md's self-review asks a human to check this. Machines are better
      # at it, and the escalation-closure failures this repository has recorded
      # were all a reference somewhere nobody re-read.
      - name: Cross-document links resolve
        run: python3 tools/check_links.py

  implementations:
    name: rust and go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No longer placeholders: both carry P-002's value model and production
      # serializer, and both are held to `testdata/canonical-query.serialized`
      # — the same bytes `tools/author_vectors.py` produces, asserted from all
      # three sides so no two of them can agree while the third drifts.
      # `--locked` because the crate now has a dependency. Without it a build
      # that silently resolved a different version of `ed25519-dalek` would be
      # green, and the version is the thing E-47 pinned: `verify_strict`'s
      # acceptance rule is what the two implementations agree on.
      - name: Rust builds
        run: cargo build --locked --verbose

      - name: Rust tests
        run: cargo test --locked --verbose

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go builds
        run: go build ./...

      - name: Go vets
        run: go vet ./...

      # Not present before P-002, because the Go side had nothing to test. The
      # Rust half of the byte agreement was already covered by `cargo test`
      # above, so without this the pair could diverge with CI green.
      - name: Go tests
        run: go test ./...

      # The two conformance runners, and the assertion that they implement the
      # contract identically. `harness cross` reports a disagreement as two
      # implementations reading the specification differently, and that
      # inference only holds if everything around the protocol already matches
      # — a runner that accepted a duplicate object key while the other refused
      # it would make `cross` report a divergence about JSON.
      #
      # Neither answers a vector yet, so this is the moment the parity is
      # cheapest to establish: there is nothing else it could be blamed on.
      - name: Both runners build
        run: |
          cargo build --bin q2d-conform
          go build -o target/q2d-go ./cmd/q2d-conform

      - name: The two runners implement the contract identically
        run: python3 -m unittest discover -s conformance/tests -p 'test_runner_parity.py'

      # P-001 §7's gate, asserted rather than run as a job that fails by design:
      # the harness runs, and reports fail for every vector, because no
      # implementation exists. It turns red the day a runner answers one, which
      # is when to replace it with the real gate.
      - name: The corpus fails against both runners, as it must today
        run: |
          for runner in target/debug/q2d-conform target/q2d-go; do
            # The status is captured rather than piped. The default shell has no
            # `pipefail`, so `harness run | tee` would report tee's success and
            # this assertion would fire on every run — passing the gate it
            # exists to guard would look identical to failing it.
            set +e
            python3 conformance/harness run --impl "$runner" > /tmp/run.txt
            status=$?
            set -e
            cat /tmp/run.txt
            if [ "$status" -eq 0 ]; then
              echo "::error::$runner passed a vector — P-001 §7's gate has moved"
              exit 1
            fi
            grep -q '^0/[0-9]* vectors passed' /tmp/run.txt || {
              echo "::error::$runner passed some vectors"; exit 1; }
          done
